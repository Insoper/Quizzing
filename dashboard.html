<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard Live</title>
<style>
:root{--bg:#0a1a33;--card:#12294d;--line:#25406b;--ink:#f1f5fb;--mute:#9db0cc;--blue:#4f9bff;--ok:#33c27a;--bad:#ff6b5e;--gold:#ffc83d}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",system-ui,sans-serif}
[hidden]{display:none!important}
button{font:inherit;cursor:pointer;border:0;border-radius:8px;padding:8px 14px;font-weight:600;color:#fff;background:var(--blue)}
button.go{background:var(--ok)} button.stop{background:var(--bad)} button.alt{background:#1d3a66}
.top{display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:14px 20px;background:var(--card);border-bottom:1px solid var(--line)}
.title{font-size:20px;font-weight:700}.sub{color:var(--mute);font-size:13px}
.kode{font-size:48px;font-weight:800;letter-spacing:8px;color:var(--gold);line-height:1}
.timer{font-size:38px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
.badge{display:inline-block;padding:2px 10px;border-radius:14px;font-size:12px;font-weight:700;background:#1d3a66;margin-left:8px;text-transform:uppercase;vertical-align:middle}
.badge.berjalan{background:var(--ok)}.badge.selesai{background:#555}
.ctl{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:14px 20px 0}
.stat{background:var(--card);border-radius:12px;padding:10px 14px}.stat b{display:block;font-size:28px;line-height:1.1}.stat span{color:var(--mute);font-size:13px}
.main{display:grid;grid-template-columns:2fr 1fr;gap:14px;padding:14px 20px 24px;align-items:start}
.main.single{grid-template-columns:1fr}
.panel{background:var(--card);border-radius:12px;padding:14px}
.panel h2{margin:0 0 10px;font-size:15px;color:var(--mute);font-weight:600}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--mute);margin-bottom:10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
#board{display:flex;flex-direction:column;gap:6px}
.r{display:grid;grid-template-columns:34px 1fr auto;grid-template-areas:"rk nm sc" "rk pb pb";column-gap:10px;row-gap:5px;align-items:center;background:#0d2140;border-radius:10px;padding:8px 10px}
.r .rk{grid-area:rk;font-weight:800;text-align:center;font-size:16px}
.r .nm{grid-area:nm;font-weight:600;font-size:15px;line-height:1.25;overflow-wrap:anywhere;word-break:break-word}
.r .sc{grid-area:sc;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mute);font-variant-numeric:tabular-nums;white-space:nowrap}
.r .sc b{color:var(--ink);font-size:14px}
.r.fin .sc b{color:var(--ok)}
.r .pb{grid-area:pb;display:flex;height:10px;background:#1d3a66;border-radius:5px;overflow:hidden}
.r .pb .ok{background:var(--ok);transition:width .8s}.r .pb .no{background:var(--bad);transition:width .8s}
.r.top1{border:1px solid var(--gold)}
.x{padding:0;width:26px;height:26px;line-height:26px;border-radius:50%;background:#1d3a66;color:var(--mute);font-size:14px}
.x:hover{background:var(--bad);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{background:#1d3a66;border-radius:16px;padding:4px 6px 4px 12px;font-size:14px;display:flex;align-items:center;gap:8px;overflow-wrap:anywhere}
.chip .x{width:22px;height:22px;line-height:22px;font-size:12px;background:#25406b}
.bar{height:8px;background:#1d3a66;border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ok)}.bar.r2 i{background:var(--bad)}
.it{margin-bottom:10px;font-size:14px}.it .row{display:flex;justify-content:space-between;gap:10px;margin-bottom:4px}
#warn{color:var(--gold);font-size:13px;margin:8px 0 0}
@media(max-width:900px){
  .main{grid-template-columns:1fr;padding:10px 10px 20px;gap:10px}
  .top{padding:10px 12px;gap:8px}
  .title{font-size:16px}.kode{font-size:30px;letter-spacing:5px}.timer{font-size:26px}
  .top>div:nth-child(2){order:-0}
  .stats{padding:10px 10px 0;gap:6px}
  .stat{padding:8px 8px}.stat b{font-size:20px}.stat span{font-size:11px;line-height:1.2;display:block}
  .panel{padding:10px}
  button{padding:6px 10px;font-size:13px}
  .r .nm{font-size:14px}
}
</style>
</head>
<body>
<div id="live" hidden>
  <div class="top">
    <div><div class="title"><span id="jdl"></span><span class="badge" id="bdg"></span></div><div class="sub" id="sub"></div></div>
    <div style="text-align:center"><div class="sub">KODE GABUNG</div><div class="kode" id="kode"></div></div>
    <div style="text-align:right"><div class="timer" id="tmr">--:--</div><div class="ctl" style="justify-content:flex-end">
      <button class="go" id="bMulai" onclick="mulai()" hidden>Mulai tes</button>
      <button class="stop" id="bAkhir" onclick="akhiri()" hidden>Akhiri</button>
      <button class="alt" onclick="tutup()">✕ Tutup</button>
      <button class="alt" onclick="document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen()">Layar penuh</button>
      <button class="alt" id="bWake" onclick="wakeToggle()" title="Cegah layar meredup">☀ Layar aktif: ...</button></div></div>
  </div>
  <div class="stats">
    <div class="stat"><b id="sJoin">0</b><span>Bergabung</span></div>
    <div class="stat"><b id="sRun">0</b><span>Mengerjakan</span></div>
    <div class="stat"><b id="sFin">0</b><span>Selesai</span></div>
    <div class="stat"><b id="sAvg">0</b><span>Rata-rata nilai</span></div>
  </div>
  <div class="main single" id="mainGrid">
    <div class="panel"><h2 id="bTitle">Peringkat</h2>
      <div class="legend"><span><i style="background:var(--ok)"></i>Benar</span><span><i style="background:var(--bad)"></i>Salah</span><span><i style="background:#1d3a66"></i>Belum dijawab</span><span>Angka kanan = sisa soal / total</span></div>
      <div id="board"></div>
      <div id="lobby" hidden style="margin-top:14px"><h2>Di lobi</h2><div class="chips" id="chips"></div></div></div>
    <div class="panel" id="pTopik" hidden><h2>Ketepatan per topik</h2><div id="topik"></div></div>
  </div>
  <p id="warn" style="padding:0 20px"></p>
</div>

<script>
var API_URL = 'https://script.google.com/macros/s/AKfycbz-FDkw6s6SnVctybbOn2UDINRMe8d5HF1tpwOEKs25qf8tV9uHXdv_BGLSFeQot41x/exec';
var PW = '', ID = '', rows = {}, D = null, started = false;
try{ PW = localStorage.getItem('inst_tok') || ''; }catch(e){}
var m = /[?&]id=(\w+)/.exec(location.search); ID = m ? m[1] : '';
function $(i){ return document.getElementById(i); }
function esc(t){ return String(t == null ? '' : t).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function call(fn, args){
  return fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ fn: fn, args: args }) })
    .then(function(r){ return r.json(); }).then(function(j){ if(j.error) throw new Error(j.error); return j.result; });
}
function keluar(){ location.replace('./?' + (ID ? 'live=' + ID : 'admin')); }
function tutup(){
  try{ if(document.fullscreenElement) document.exitFullscreen(); }catch(e){}
  location.href = './?admin';
}
document.addEventListener('keydown', function(e){ if(e.key === 'Escape' && !document.fullscreenElement && !$('live').hidden) tutup(); });

// ===== Anti redup (Screen Wake Lock) =====
var wakeLock = null, wakeWanted = true;
function wakeUI(){
  var b = $('bWake'); if(!b) return;
  var ok = !!wakeLock;
  b.textContent = ok ? '☀ Layar aktif: ON' : '☀ Layar aktif: OFF';
  b.style.background = ok ? 'var(--ok)' : '#1d3a66';
}
function wakeOn(){
  if(!wakeWanted || wakeLock || document.visibilityState !== 'visible') return;
  if(!('wakeLock' in navigator)){ $('bWake').textContent = '☀ Tidak didukung browser'; return; }
  navigator.wakeLock.request('screen').then(function(l){
    wakeLock = l; wakeUI();
    l.addEventListener('release', function(){ wakeLock = null; wakeUI(); });
  }).catch(function(){ wakeLock = null; wakeUI(); });
}
function wakeToggle(){
  wakeWanted = !wakeWanted;
  if(wakeWanted) wakeOn(); else if(wakeLock){ wakeLock.release(); wakeLock = null; wakeUI(); } else wakeUI();
}
document.addEventListener('visibilitychange', wakeOn);       // aktifkan lagi saat kembali ke tab
['click','touchstart','keydown'].forEach(function(ev){ document.addEventListener(ev, wakeOn, { passive: true }); }); // beberapa browser butuh sentuhan pertama
setInterval(wakeOn, 15000);                                   // cadangan kalau lock terlepas
function start(){
  $('live').hidden = false;
  if(started) return; started = true;
  poll(); setInterval(poll, 3000); setInterval(tick, 1000); wakeOn();
}
function poll(){
  call('adm_dash', [PW, ID]).then(function(d){ $('warn').textContent = ''; render(d); })
    .catch(function(e){
      if(/password/i.test(e.message)){ try{ localStorage.removeItem('inst_tok'); }catch(x){} keluar(); return; }
      $('warn').textContent = 'Koneksi bermasalah, mencoba lagi...';
    });
}
function fmt(s){ var h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), d = s % 60, p = function(n){ return (n < 10 ? '0' : '') + n; }; return (h ? h + ':' : '') + p(m) + ':' + p(d); }
function tick(){
  if(!D) return; var s = D.sesi, t = $('tmr');
  if(s.state === 'menunggu'){ t.textContent = s.mode === 'live' ? 'Menunggu' : new Date(s.mulai).toLocaleString('id-ID', { dateStyle: 'short', timeStyle: 'short' }); }
  else if(s.state === 'berjalan'){ var left = Math.max(0, Math.round((s.selesai - Date.now()) / 1000)); t.textContent = fmt(left); t.style.color = left <= 60 ? 'var(--bad)' : ''; }
  else t.textContent = 'Selesai';
}
function mulai(){ if(confirm('Mulai tes sekarang untuk semua peserta?')) call('adm_mulai', [PW, ID]).then(poll).catch(function(e){ alert(e.message); }); }
function akhiri(){ if(confirm('Akhiri sesi dan nilai semua jawaban yang belum dikirim?')) call('adm_akhiri', [PW, ID]).then(function(r){ alert(r.dinilai + ' peserta dinilai otomatis.'); poll(); }).catch(function(e){ alert(e.message); }); }
// hapus peserta (butuh fungsi adm_hapus di Apps Script: [token, idSesi, nama])
function hapus(nama){
  if(!confirm('Hapus peserta "' + nama + '" dari sesi ini?')) return;
  call('adm_hapus', [PW, ID, nama]).then(poll).catch(function(e){ alert(e.message); });
}
// jumlah benar: pakai p.benar bila ada, kalau tidak turunkan dari nilai (0-100)
function benarDari(p, n){
  var b = p.benar != null ? p.benar : Math.round((p.nilai || 0) * n / 100);
  return Math.max(0, Math.min(b, p.jawab || 0));
}
function render(d){
  D = d; var s = d.sesi, ps = d.ps, n = s.n || 1;
  $('jdl').textContent = s.jenis + ' - ' + s.kat; $('bdg').textContent = s.state; $('bdg').className = 'badge ' + s.state;
  $('sub').textContent = n + ' soal'; $('kode').textContent = s.kode;
  $('bMulai').hidden = !(s.mode === 'live' && s.state === 'menunggu');
  $('bAkhir').hidden = s.state === 'selesai' && ps.every(function(p){ return p.selesai; });
  var lobi = ps.filter(function(p){ return p.lobi; }), aktif = ps.filter(function(p){ return !p.lobi; });
  var fin = ps.filter(function(p){ return p.selesai; }).length;
  var avg = aktif.length ? Math.round(aktif.reduce(function(a, p){ return a + p.nilai; }, 0) / aktif.length) : 0;
  $('sJoin').textContent = ps.length; $('sRun').textContent = aktif.length - fin; $('sFin').textContent = fin; $('sAvg').textContent = avg;
  $('bTitle').textContent = (s.state === 'selesai' ? '🏆 Hasil akhir' : 'Peringkat') + (aktif.length ? ' (' + aktif.length + ')' : '');
  var keep = {}, medal = ['🥇', '🥈', '🥉'], board = $('board');
  aktif.forEach(function(p, i){
    var el = rows[p.nama];
    if(!el){
      el = document.createElement('div'); el.className = 'r';
      el.innerHTML = '<div class="rk"></div><div class="nm"></div><div class="pb"><span class="ok" style="width:0"></span><span class="no" style="width:0"></span></div><div class="sc"><span class="left"></span><button class="x" title="Hapus peserta" aria-label="Hapus peserta">✕</button></div>';
      el.querySelector('.x').addEventListener('click', function(){ hapus(p.nama); });
      board.appendChild(el); rows[p.nama] = el;
    }
    keep[p.nama] = 1; el.style.order = i; el.classList.toggle('fin', !!p.selesai); el.classList.toggle('top1', i === 0 && p.jawab > 0);
    var b = benarDari(p, n), salah = Math.max(0, (p.jawab || 0) - b), sisa = Math.max(0, n - (p.jawab || 0));
    el.children[0].textContent = medal[i] || (i + 1);
    el.children[1].textContent = p.nama;
    el.children[2].children[0].style.width = (b / n * 100) + '%';
    el.children[2].children[1].style.width = (salah / n * 100) + '%';
    el.querySelector('.left').innerHTML = p.selesai ? '<b>Selesai</b>' : '<b>' + sisa + '/' + n + '</b> sisa';
  });
  Object.keys(rows).forEach(function(k){ if(!keep[k]){ rows[k].remove(); delete rows[k]; } });
  $('lobby').hidden = !lobi.length;
  $('chips').innerHTML = lobi.map(function(p, i){ return '<span class="chip">' + esc(p.nama) + '<button class="x" data-i="' + i + '" title="Hapus peserta" aria-label="Hapus peserta">✕</button></span>'; }).join('');
  Array.prototype.forEach.call($('chips').querySelectorAll('.x'), function(btn){ btn.onclick = function(){ hapus(lobi[btn.getAttribute('data-i')].nama); }; });
  var tp = d.topik || [];
  var showTopik = tp.length > 1 || (tp[0] && tp[0].nama !== 'Umum');
  $('pTopik').hidden = !showTopik; $('mainGrid').className = 'main' + (showTopik ? '' : ' single');
  $('topik').innerHTML = tp.map(function(t){ var pc = t.jawab ? Math.round(t.benar / t.jawab * 100) : 0;
    return '<div class="it"><div class="row"><span>' + esc(t.nama) + '</span><b>' + pc + '%</b></div><div class="bar ' + (pc < 50 ? 'r2' : '') + '"><i style="width:' + pc + '%"></i></div></div>'; }).join('');
  tick();
}
if(PW && ID) start(); else keluar();
</script>
</body>
</html>
